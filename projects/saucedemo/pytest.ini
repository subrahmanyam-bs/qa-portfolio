[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Critical-path tests that must pass before every merge
    regression: Broader coverage, run on a schedule or before releases
    login: Login and logout behavior
    cart: Cart add/remove/validation behavior
    checkout: Checkout information and completion behavior
    e2e: Full end-to-end purchase journeys

addopts = --html=reports/report.html --self-contained-html --tb=short --strict-markers
